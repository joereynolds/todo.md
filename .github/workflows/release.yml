name: release

# Push a tag matching the CMake project() version, e.g.
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)build, e.g. v0.1.0'
        required: true

permissions:
  contents: write

jobs:
  appimage:
    # Older glibc than the latest runner, so the AppImage runs on more distros.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Check tag matches the CMake version
        run: |
          version=$(sed -nE 's/^project\(todomd VERSION ([0-9.]+) .*/\1/p' CMakeLists.txt)
          echo "CMake version: $version, tag: $TAG"
          test "v$version" = "$TAG" || { echo "::error::Tag $TAG does not match project version $version"; exit 1; }

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          cache: true

      - name: Install build tools and libraries to bundle
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl1-mesa-dev libegl1 libfontconfig1 fonts-dejavu-core \
            libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build

      - name: Test
        working-directory: build
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --output-on-failure

      - name: Package AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          LDAI_OUTPUT: todomd-${{ env.TAG }}-x86_64.AppImage
          OUTPUT: todomd-${{ env.TAG }}-x86_64.AppImage # older linuxdeploy name
        run: |
          DESTDIR=$PWD/AppDir cmake --install build
          base=https://github.com/linuxdeploy
          curl -fsSLO $base/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -fsSLO $base/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage
          ./linuxdeploy-x86_64.AppImage --appdir AppDir --plugin qt --output appimage \
            --desktop-file AppDir/usr/share/applications/todomd.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/scalable/apps/todomd.svg
          ls -la *.AppImage

      - name: Smoke test the AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          QT_QPA_PLATFORM: offscreen
        run: ./todomd-${TAG}-x86_64.AppImage --version

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          generate_release_notes: true
          files: todomd-${{ env.TAG }}-x86_64.AppImage
